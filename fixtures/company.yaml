              Restricted. Only HR owners may read this procedure.

              1. HR registers the complaint in the case log within 1 business day and assigns an investigator who has no reporting line to anyone involved.
              2. The investigator contacts the complainant within 3 working days and the subject of the complaint within 5 working days.
              3. Interviews are documented and signed. Evidence is stored only in this folder.
              4. The investigation is closed within 30 days. Extensions need approval from the Finance Director and Legal Counsel jointly.
              5. The outcome is communicated in writing to both parties.

              Records are kept for 5 years and then destroyed. No information about a case is shared with managers who are not directly involved.
