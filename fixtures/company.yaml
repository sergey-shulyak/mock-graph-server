          - path: /General/company-handbook-overview.md
            content: |
              # Contoso at a glance

              Contoso Software was founded in 2014 in Lviv, Ukraine. In October 2026 we are about 240 people working from our Lviv headquarters, our Krakow office (opened in March 2023) and remotely across Ukraine and Poland.

              ## What we build

              - **Contoso Ledger**: an accounting and payments platform for small and medium businesses. About 412 customer organisations use it as of the third quarter of 2026.
              - **Contoso Pulse**: an analytics add-on for Ledger that turns transaction data into dashboards.
              - **Contoso Portal**: the customer-facing web application. It is being rebuilt as project Phoenix, with a public beta planned for 16 November 2026.

              ## How we are organised

              Engineering is the largest department (roughly 110 people), followed by Product and Design, Support, Sales, Marketing, HR, Finance, IT and Legal. Department heads form the management committee together with the CEO. Frank Manager leads Engineering, Irene Finance is the Finance Director and Karen Legal is our Legal Counsel.

              ## Working agreements

              - English is the working language of the company.
              - Core hours are 11:00 to 16:00 Kyiv time. Meetings should be scheduled inside core hours.
              - We use Slack for chat, Jira for work tracking (the product development project key is SCRUM), GitHub for code and Okta for sign-in.
              - Decisions that affect more than one team are written down in the relevant wiki space or as an ADR (architecture decision record).

              ## Our values

              1. Own it. Pick up problems that nobody owns yet.
              2. Be kind and direct.
              3. Ship small, ship often.
              4. Write it down.

              New colleagues should continue with the new hire checklist in General/Onboarding and the employee FAQ.
