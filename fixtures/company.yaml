            content: |
              # Employee FAQ

              _Last updated: 3 November 2025. Owner: HR and IT._

              **How do I book vacation?**
              Use the HR portal at least 2 weeks in advance. Your manager approves it.

              **Who do I ask about the office Wi-Fi?**
              Ask Support. The network name and the monthly password rotation are described in office-wifi.md.

              **Where do I get IT help?**
              Post in the Slack channel #it-help or open a ticket in the IT portal. The helpdesk works 08:00 to 18:00 Kyiv time on weekdays.

              **When is salary paid?**
              Salary is paid on the 25th of every month. If the 25th is not a working day, it is paid on the previous working day.

              **How quickly does Support answer a ticket?**
              Support aims to give a first response within 8 business hours. Urgent tickets are marked P1 and are picked up first.

              **Do I need the VPN?**
              Yes, when you are outside the offices and need internal systems such as Jira or the internal wiki.

              **What do I do if I think my laptop or account was compromised?**
              Report it immediately to security@contoso-mock.onmicrosoft.com and in #sec-incidents.

              **Where are the policies?**
              HR policies are in the HR site under Policies. IT and security guides are in General/IT and General/Security of the Knowledge Base.
