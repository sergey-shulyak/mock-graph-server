          - path: /Public/nda-process.md
            content: |
              # NDA process

              _Owner: Legal (Karen Legal). Applies to everyone who shares non-public information with outside parties._

              ## When you need an NDA

              Before you share anything that is not public, such as pricing for a prospect, unreleased roadmap or source code, a non-disclosure agreement must be signed. Contractors sign one before their first day.

              ## Steps

              1. Request an NDA in the Slack channel #legal-requests or with the legal request form. Give the name of the other party and the purpose.
              2. Legal prepares the NDA from the standard template within 2 business days.
              3. The counterparty signs. If they ask for changes, Legal reviews them.
              4. Only authorised signatories sign for Contoso: the Legal Counsel, the Finance Director and the CEO. Employees must not sign NDAs themselves.
              5. Legal stores the signed NDA in the contract repository and replies to the requester.

              ## Standard terms

              - A mutual NDA lasts 3 years.
              - A one-way NDA, where only Contoso discloses, lasts 2 years.
              - Confidentiality obligations for trade secrets continue after the term for as long as the information stays secret.

              ## Do not

              Do not share source code, customer data or the unreleased roadmap until Legal confirms that the NDA is signed. A signed NDA does not allow sharing customer personal data; use a data processing agreement for that.
