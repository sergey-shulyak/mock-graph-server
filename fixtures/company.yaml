          - path: /Postmortems/2026-03-12-database-failover.md
            content: |
              # Postmortem: ledger database failover, 12 March 2026

              Severity: SEV2. Duration: 38 minutes (14:07 to 14:45 Kyiv time). Incident commander: Henry DevOps. Author: Alice Backend.

              ## Summary

              The primary of the ledger PostgreSQL cluster stopped accepting writes because its write-ahead log volume was full. Patroni failed over, but the new primary also filled its volume within minutes. Customers saw errors when posting journal entries. No data was lost.

              ## Timeline

              - 14:07 Alert `LedgerDbPrimaryDown` fires.
              - 14:12 Henry acknowledges and starts the failover runbook.
              - 14:20 A manual failover is performed to the second replica.
              - 14:31 The cause is found: an abandoned replication slot from a decommissioned reporting replica retained WAL files.
              - 14:38 The slot is dropped and the disk drains.
              - 14:45 Writes recover and the incident is closed.

              ## Root cause

              A replication slot for a replica that had been removed in February was never dropped. It prevented PostgreSQL from recycling WAL segments, so the volume filled over three weeks. The disk alert threshold was set to 90 percent and fired too late.

              ## Actions

              1. Lower the database disk alert to 70 percent. Owner: Henry. Done on 20 March.
              2. Add a monitor for inactive replication slots. Owner: Alice. Done on 27 March.
              3. Add the decommissioning checklist step "drop replication slots". Owner: Henry. Done on 3 April.
