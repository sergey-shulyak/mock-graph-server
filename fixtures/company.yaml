          - path: /Handbook/branching-and-code-review.md
            content: |
              # Branching and code review

              ## Branching

              - We use trunk-based development. The `main` branch of every repository is protected and always deployable.
              - Create short-lived branches named `SCRUM-<ticket number>-<short-description>`, for example `SCRUM-482-fix-ledger-rounding`. Branches should live for no more than 3 working days.
              - Merge with **squash merge** only. The squashed commit message follows Conventional Commits (`feat:`, `fix:`, `docs:`, `chore:`).
              - Direct pushes to `main` are blocked. Force pushes are blocked.

              ## Pull requests

              - Aim for fewer than 400 changed lines. Split larger changes.
              - A pull request needs a description, a link to the Jira ticket and a note on how it was tested.
              - CI must be green: unit tests, lint, static analysis (SAST) and the container scan. New code needs at least 80 percent test coverage.

              ## Reviews

              - One approval is required. Changes to `ledger-service` and `payments-service` need two approvals, one of them from a code owner listed in CODEOWNERS.
              - Reviewers respond within 1 business day. If you cannot, say so and reassign.
              - Authors do not merge their own pull request until all comments are resolved.
              - Review for correctness, security, readability and tests, in that order. Use "nit:" for optional style remarks.

              ## Hotfixes

              A hotfix branch is cut from the last released tag and merged back into `main`. Hotfixes need approval from the on-call lead before deployment.
          - path: /Handbook/engineering-handbook.md
            content: |
              # Contoso engineering handbook

              _Edition of 1 July 2026. Owner: Frank Manager. Audience: everyone in Engineering, including contractors who have access to this site._

              This handbook explains how engineering works at Contoso: our tools, our standards, and what we expect from each other. Detailed process pages (branching, releases, on-call, incident response) are separate documents in this folder; this handbook gives the overview and the reasons behind the rules.

              ## 1. Organisation

              Engineering has about 110 people in four areas.

              - **Backend** (Engineering - Backend) builds the Ledger services in Kotlin. Alice Backend is the senior engineer for the ledger and payments services.
              - **Frontend** (Engineering - Frontend) builds the customer portal and internal tools in React and TypeScript. Bob Frontend leads the frontend guild.
              - **QA** is led by Grace QA and covers test strategy, end-to-end automation and release sign-off.
              - **DevOps and platform** is led by Henry DevOps. The team owns Kubernetes, Terraform, CI pipelines, observability and the on-call rotation.

              Frank Manager heads Engineering and reports to the CEO. Each team has a manager or lead who runs one-to-ones every week and agrees goals in January.

              ## 2. Technology stack

              | Area | Choice |
              |---|---|
              | Backend language | Kotlin 2.0 with Spring Boot 3.3 |
              | Frontend | React 18, TypeScript 5, Vite |
              | Database | PostgreSQL 16, migrated with Flyway |
              | Messaging | Apache Kafka 3.7 |
              | Cache | Redis 7 |
              | Runtime | Kubernetes 1.30 on Azure |
              | Infrastructure as code | Terraform |
              | CI/CD | GitHub Actions and ArgoCD |
              | Observability | Prometheus, Grafana, Loki; alerts through PagerDuty |
              | Secrets | HashiCorp Vault |

              Introducing a new language, database or messaging system needs an ADR and approval of the architecture group (Frank Manager, Alice Backend, Henry DevOps and one frontend representative).

              ## 3. Repositories and environments

              All code is in GitHub Enterprise. The most important repositories are `ledger` (backend services), `portal-web` (frontend), `infra` (local development and Terraform) and `contoso-deploy` (deployment tooling). Local setup is described in the Engineering section of the Knowledge Base; it uses Docker Desktop and `docker compose up` from the infra repository.

              There are four environments:

              1. **Local**: your laptop with Docker.
              2. **Dev**: deployed from every merge to `main`; data is synthetic.
              3. **Staging**: a production-like environment where QA signs off each release train.
              4. **Production**: customers; access is temporary and audited.

              Customer data must never be copied outside production. Test data is generated by the `seed-data` tool.

              ## 4. Definition of done

              A ticket is done when:

              - The code is reviewed and merged into `main` (see branching and code review).
              - Automated tests exist and pass, with at least 80 percent coverage for new code.
              - Monitoring, alerts and dashboards are updated if behaviour changed.
              - Documentation and the runbook are updated.
              - The feature is behind a flag if it is not ready for every customer.
              - Grace QA or a delegate has verified the change on staging for anything customer-facing.

              ## 5. Testing strategy

              We follow a test pyramid.

              - **Unit tests** run in under 5 minutes for each service and run on every pull request.
              - **Integration tests** use Testcontainers for PostgreSQL and Kafka. They run on every pull request and must finish in 10 minutes.
              - **End-to-end tests** are written in Playwright and cover the 40 most important customer journeys. The suite takes about 14 minutes and runs for every release train and nightly.
              - **Performance tests** run before every minor release for the ledger API with a target of 500 requests per second at a 95th percentile latency under 300 ms.
              - **Contract tests** protect the public API: breaking changes require a new version (see ADR-0019).

              Flaky tests are a team problem. A flaky test is fixed or quarantined within 5 working days.

              ## 6. Security in engineering

              - Dependencies are scanned on every build. Critical vulnerabilities must be fixed within 7 days and high ones within 30 days.
              - Allowed open-source licences are MIT, Apache-2.0 and BSD. Libraries under GPL or AGPL need written approval from Legal Counsel before use.
              - Secrets are stored in Vault. They never appear in repositories, build logs or chat. Secret scanning runs on every push; a detected secret must be rotated at once and reported as a security incident.
              - Production database access is temporary: ask the on-call lead, and expect the access to expire after 8 hours.
              - Customer personal data is Confidential. Logs must not contain names, emails or bank details.
              - Threat modelling is required for any new service that touches payments, authentication or personal data.

              ## 7. Observability

              Every service exposes health endpoints, RED metrics (rate, errors, duration) and structured JSON logs. The standard dashboards are `Ledger / Service overview` and `Platform / Kubernetes`. Service level objectives for the Ledger API are 99.9 percent availability per month and a 95th percentile latency under 300 ms. A service owner reviews the error budget on the first Monday of each month.

              Alerts must be actionable. Each alert links to a runbook; an alert without a runbook is a bug. Noisy alerts are reviewed at the engineering weekly and are tuned or deleted.

              ## 8. Working with data

              Database changes are made only with Flyway migrations. We never edit an applied migration; we add a new one. Large migrations are split into expand, migrate and contract steps so that two versions of the service can run at the same time. Destructive migrations (dropping a column or table) happen at least one release after the last code reference is removed.

              Event schemas in Kafka are defined in Avro and registered in the schema registry. Only backwards compatible changes are allowed. Topics are named `<domain>.<entity>.<event>`, for example `ledger.entry.posted`.

              ## 9. Code quality

              - Formatting is enforced by tools: ktlint for Kotlin and Prettier for TypeScript. Do not argue about style in reviews.
              - Functions should be small and names should explain intent. Prefer clear code over comments, but comment the "why".
              - Every public API has documentation generated from its OpenAPI description.
              - Performance regressions above 10 percent in the benchmark suite block a release.
              - Architecture decisions are recorded as ADRs. ADR numbers are allocated by opening a pull request that adds the next number in the Architecture folder.

              ## 10. Releases and operations

              Releases follow the train on Tuesdays and Thursdays. On-call engineers are expected to know the runbooks. When something breaks, follow the incident response process and write a blameless postmortem for SEV1 and SEV2 incidents. See the dedicated pages for the details; the key numbers are the 14:00 release time, the 10 percent canary for 30 minutes, the 10-minute acknowledgement time for pages and the 5-business-day postmortem deadline.

              ## 11. Estimation and planning

              We plan in two-week sprints. Sprint planning is on the first Wednesday of the sprint, and the demo and retrospective are on the last Thursday. Estimates use story points on a Fibonacci scale; anything above 8 points must be split. Teams commit to about 80 percent of their average velocity, to leave room for support work and incidents. The product owner for each team owns the priority order; the engineering manager owns capacity.

              Quarterly planning sets objectives and key results. Each team keeps no more than three objectives. Roadmap changes are communicated in the engineering weekly and in #engineering-announcements.

              ## 12. Hiring and growing the team

              Engineers interview candidates using the standard rubric: a 30-minute screening call, a 90-minute technical interview with a coding exercise and a system design discussion, and a final conversation with the hiring manager. Feedback is written within 24 hours. New engineers get a buddy and a 30-60-90 day plan; the first pull request should be merged by day 10. Levels from L1 to L7 are discussed in the annual review; promotion criteria are published on the engineering wiki.

              ## 13. Documentation

              Documentation lives close to the code. Each repository has a `README.md` that explains how to build, test and run the service in under 10 minutes. Runbooks are in the engineering runbooks library, ADRs are in the Architecture folder and meeting notes are in Meetings. When you change behaviour, update the documentation in the same pull request. Stale documents are reviewed quarterly and archived when they have not been touched for 18 months.

              ## 14. Contractors

              Contractors follow the same rules as employees for code and security. Their accounts are temporary, valid for 90 days at a time, and their access is limited to the project they work on. A contractor may not be added to the on-call rotation. The sponsoring manager renews the account and confirms the access list every 90 days.

              ## 15. Where to get help

              - Build or CI problems: #dev-platform
              - Production issues: #on-call (only for real incidents)
              - Architecture questions: #architecture
              - Security questions: #security or security@contoso-mock.onmicrosoft.com
              - Access to repositories and environments: the access request form in the IT portal

              ## 16. Changes to this handbook

              Anyone can propose changes with a pull request to the `engineering-handbook` repository; Frank Manager approves them. Material changes are announced at the engineering weekly. The handbook is reviewed in full every July.
          - path: /Handbook/incident-response.md
            content: |
              # Incident response

              ## Severity levels

              | Level | Meaning | Example |
              |---|---|---|
              | SEV1 | Customer-wide outage or customer data exposure | Payments down for all customers |
              | SEV2 | Major feature degraded for many customers | Bank feeds delayed by hours |
              | SEV3 | Minor degradation, workaround exists | Slow CSV export |
              | SEV4 | Cosmetic or internal only | Typo in invoice template |

              ## Roles

              - **Incident commander (IC)** runs the incident, assigns roles and makes decisions.
              - **Communications lead** posts updates to the status page and to Support.
              - **Ops lead** investigates and applies fixes.

              ## Timeline for SEV1

              1. The primary on-call pages the IC within 5 minutes.
              2. Open a dedicated Slack channel named `#inc-<date>-<short-name>`.
              3. Publish the first status page update within 15 minutes, then every 30 minutes until resolved.
              4. Support (Dave Support) informs affected customers through the support queue.

              ## After the incident

              SEV1 and SEV2 incidents require a blameless postmortem within 5 business days. Postmortems are stored in the Postmortems folder of the engineering runbooks library. Action items get an owner and a due date in Jira and are reviewed at the engineering weekly meeting. A postmortem names causes in systems and processes, never in people.
          - path: /Handbook/on-call-policy.md
            content: |
              # On-call policy

              _Version 2026-01, effective 1 January 2026. Owner: DevOps (Henry DevOps), on-call lead._

              ## Rotation

              - The on-call rotation is weekly. The hand-off is on Monday at 10:00 Kyiv time.
              - Six engineers are in the rotation. Each week there is a primary and a secondary on-call.
              - Henry DevOps is the on-call lead and arranges swaps. Swaps must be agreed in the #on-call channel before the shift.

              ## Response times

              - Alerts page the primary on-call through PagerDuty. Acknowledge within 10 minutes.
              - If the primary does not acknowledge, PagerDuty pages the secondary after 10 minutes and the on-call lead after 20 minutes.
              - For SEV1 incidents the incident commander must be paged within 5 minutes.

              ## Compensation

              - The on-call allowance is EUR 150 per on-call week. It is paid with the next salary.
              - A call-out outside working hours that lasts more than 2 hours earns one day off in lieu.

              ## Production access

              On-call engineers can grant temporary production access. The on-call lead approves requests for production database access and the access expires after 8 hours.

              ## Preparation

              Before your first rotation, shadow one full week and read the runbooks in the engineering runbooks library. Your laptop must have VPN access and PagerDuty installed.
          - path: /Handbook/release-process.md
            content: |
              # Release process

              _Owner: DevOps (Henry DevOps). Last updated 2 September 2026._

              ## Cadence

              Production releases follow a release train on **Tuesdays and Thursdays at 14:00 Kyiv time**. The code freeze for each train starts at 12:00 on the same day. We do not release on Fridays or on the working day before a public holiday.

              ## Versions

              Release versions use the form `<year>.<month>` followed by a patch number, for example `2026.10.2`. Release notes are posted in #releases.

              ## Steps

              1. The release manager (rotating weekly) creates the release tag from `main` after the freeze starts.
              2. The pipeline builds containers, runs the full regression suite and publishes to staging.
              3. QA (Grace QA) signs off the staging build.
              4. ArgoCD deploys to production as a canary on 10 percent of traffic.
              5. After 30 minutes without alerts, the deployment goes to 100 percent.

              ## Automatic rollback

              If the error rate stays above 2 percent for 5 minutes during a canary, the deployment rolls back automatically. Anyone on call can also trigger a rollback with `contoso-deploy rollback <service>`.

              ## Hotfixes

              Hotfixes may be released outside the train with approval of the on-call lead. They still need a green pipeline and a second reviewer.

              ## Database changes

              Database migrations run with Flyway before the new version starts. Migrations must be backwards compatible with the previous release, because a rollback does not undo them.
          - path: /Handbook/team-working-agreements.md
            content: |
              # Engineering team working agreements

              _Agreed in the engineering offsite, 12 June 2026. Owner: Frank Manager._

              ## Presence

              - Engineering works remotely up to 4 days per week. The office day for the whole department is Tuesday.
              - Monday and Friday are meeting-free days, apart from the weekly one-to-ones.
              - Core hours are 11:00 to 16:00 Kyiv time. Stand-ups are at 10:30.

              ## Communication

              - Questions go in the team channel, not in direct messages, so answers are searchable.
              - Write design proposals as short documents and give reviewers 3 working days.
              - A decision with long-term impact becomes an ADR in the Architecture folder.

              ## Quality

              - Every bug fix includes a test that fails without the fix.
              - Feature flags guard anything that is not ready for all customers.
              - Flaky tests are fixed or quarantined within 5 working days.

              ## Learning

              Each team runs a demo or tech talk slot at the engineering weekly, on a rotating schedule.
