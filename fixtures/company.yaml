            breakInheritance: true
            permissions:
              - { principal: siteGroup:hr-owners, role: owner }
          - path: /Recruiting/referral-program.md
            content: |
              # Employee referral programme

              Contoso pays EUR 1,000 for every referred candidate who is hired and passes the 3-month probation period. The bonus is paid with the next salary after probation ends.

              ## Rules

              - Submit the referral through the HR portal before the candidate applies.
              - The candidate must not have applied in the previous 6 months.
              - Hiring managers and recruiters cannot receive a bonus for roles in their own team.
              - Referrals for senior roles (level L5 and above) pay EUR 1,500.

              ## Recruiters' process

              Recruiters respond to every referral within 3 working days. Interviews follow the standard process: a 30-minute screening call, a technical or role interview of 90 minutes and a final conversation with the hiring manager.

