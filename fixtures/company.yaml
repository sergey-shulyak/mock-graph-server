          - path: /Architecture/ADR/0007-postgres-for-ledger.md
            content: |
              # ADR-0007: Use PostgreSQL as the system of record for the ledger

              Status: Accepted. Date: 15 February 2024. Deciders: Frank Manager, Alice Backend.

              ## Context

              The ledger must guarantee that every journal entry balances and that history is never lost. We need strong transactions, mature tooling and a team that can operate it.

              ## Options considered

              1. **PostgreSQL 16** with logical replication and Patroni for high availability.
              2. **MongoDB**: flexible documents, but multi-document transactions were costly for our workload.
              3. **A managed globally distributed database**: attractive for scale, but vendor lock-in and cost were high.

              ## Decision

              We use PostgreSQL 16 as the single system of record for the ledger. Schema changes are made with Flyway migrations. Reporting reads from asynchronous replicas.

              ## Consequences

              - Strong consistency for money movement; double-entry checks are enforced by constraints.
              - We operate the cluster ourselves (see the database failover runbook).
              - Horizontal scale beyond a single primary requires partitioning by customer, which we have deferred.
              - All analytics queries for Contoso Pulse must go to replicas, never the primary.
