              DEVICE POLICY (version 2026-03)

              Laptops
              - Engineers receive a MacBook Pro 14 inch. Other roles receive a Dell Latitude 7450.
              - Laptops are refreshed every 36 months.
              - Full-disk encryption (FileVault on macOS, BitLocker on Windows) is mandatory and enforced by device management.
              - The screen locks automatically after 5 minutes of inactivity.

              Loss and theft
              - Report a lost or stolen device to #it-help and to security@contoso-mock.onmicrosoft.com within 1 hour of noticing.
              - IT will lock and wipe the device remotely.

              Personal devices
              - Personal devices must not be used to access source code or customer data.
              - Email and Slack are allowed on personal phones if the device is enrolled in mobile device management.

              Returning devices
              - Leavers return their laptop and badge within 5 business days of the last working day.
