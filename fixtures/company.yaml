            content: |
              # Project Atlas retrospective

              Project Atlas migrated the billing engine to the new invoicing service. It ran from January to 12 December 2025.

              ## Results

              - 380 customer organisations migrated without data loss.
              - Budget overrun of 14 percent: EUR 310,000 planned and EUR 353,000 spent.
              - Invoice generation time dropped from 40 seconds to 6 seconds.

              ## What went well

              - A parallel run of old and new billing for two months caught 11 rounding differences before cutover.
              - Weekly demos kept Finance and Support involved.

              ## What did not

              - The migration scripts were written late and tested on small data sets.
              - The decision to support legacy invoice formats was made after the schedule was fixed.

              ## Lessons

              Run migrations against a full copy of production data from the first month. Freeze scope before the build phase starts.
