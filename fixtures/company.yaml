          - path: /General/IT/password-policy.md
            content: |
              # Password and MFA policy

              _Version 3.0, effective 1 February 2026. Owner: IT (Leo IT)._

              ## Passwords

              - Minimum length is 14 characters. Long passphrases are encouraged.
              - Passwords are stored only in the company password manager, 1Password. Do not write them down or save them in browsers.
              - Passwords are not rotated on a schedule. You must change a password immediately if you suspect it was exposed.
              - Passwords are checked against a list of known breached passwords when they are set.
              - Never reuse a work password anywhere else and never share it, not even with IT. IT will never ask for your password.

              ## Multi-factor authentication

              MFA is mandatory for every account. The approved method is the Okta Verify app. SMS codes are not allowed.

              ## Lockout

              After 5 failed sign-in attempts an account is locked for 15 minutes. If you are locked out for longer, contact #it-help.

              ## Service accounts

              Service accounts are owned by IT and their secrets are stored in HashiCorp Vault. Engineers must not create personal copies of service credentials.
          - path: /General/IT/software-requests.md
            content: |
              # Requesting software

              ## Standard catalogue

              Most tools (browsers, IDEs, Docker Desktop, Slack, Zoom, 1Password) are in Contoso Self Service and install immediately without approval. Open Self Service on your laptop and search for the application.

              ## Anything not in the catalogue

              1. Open a "Software request" in the IT portal.
              2. State the business reason, the number of users and the price.
              3. Your manager approves the request.
              4. The security team runs a vendor and licence review. This takes up to 5 business days.
              5. IT installs the software or buys the licence.

              ## Costs

              If the licence costs more than EUR 200 per year, Finance must approve it as well. Purchases above EUR 1,000 follow the procurement policy in the Finance site.

              ## Rules

              - Do not install cracked, unlicensed or personal-use software on a company laptop.
              - Browser extensions that read page content need a security review.
              - Open-source libraries used in products are covered by the engineering handbook, not by this page.
          - path: /General/IT/VPN Guide (copy).md
            content: |
              # VPN guide

              Contoso uses the GlobalProtect VPN client.

              ## When to use it

              Connect to the VPN whenever you are outside the Lviv and Krakow offices and need internal systems: Jira, GitHub Enterprise, the internal wiki, staging environments and the IT portal. You do not need the VPN for Slack, mail or Okta.

              ## Setup

              1. Open Contoso Self Service and install "GlobalProtect".
              2. Enter the portal address vpn.contoso-mock.example.
              3. Sign in with your Okta account and approve the Okta Verify push.

              ## Limits

              - A VPN session lasts 12 hours. After that you must reconnect.
              - You can connect from at most 3 devices at the same time.
              - The VPN uses split tunnelling, so only traffic for internal addresses goes through it.

              ## Troubleshooting

              If the connection fails on hotel or airport Wi-Fi, open the client settings and switch the transport to SSL on TCP port 443. If it still fails, post in #it-help with a screenshot of the error. Do not install other VPN clients on your work laptop.
