          - path: /Runbooks/database-failover.md
            content: |
              # Runbook: PostgreSQL failover (ledger cluster)

              _Owner: DevOps. Alert: `LedgerDbPrimaryDown`. Severity: SEV1 if writes fail for more than 5 minutes._

              ## Background

              The ledger database is a Patroni cluster with one primary and two replicas. If the primary is unreachable for 30 seconds, Patroni promotes the healthiest replica automatically. A normal failover completes in under 60 seconds.

              ## Steps

              1. Check the cluster state: `patronictl -c /etc/patroni.yml list`.
              2. If a new leader exists, verify that `ledger-service` pods are connected: open the Grafana dashboard `Ledger / Service overview` and look at the connection pool panel.
              3. If no leader was elected after 2 minutes, run a manual failover to the replica with the lowest lag: `patronictl -c /etc/patroni.yml failover --candidate <replica-name>`.
              4. Do not promote a replica that is more than 10 MB behind without approval of the incident commander.
              5. After failover, rebuild the old primary as a replica: `patronictl -c /etc/patroni.yml reinit <old-primary>`.

              ## Checks afterwards

              - Disk usage on the new primary is below 70 percent.
              - Replication lag of both replicas is below 1 second.
              - Kafka consumers for `ledger.entry.posted` have caught up.

              ## Escalation

              Page the on-call lead (Henry DevOps). If data loss is suspected, declare SEV1 and inform the Legal Counsel through the incident commander.
          - path: /Runbooks/high-cpu-alert.md
            content: |
              # Runbook: high CPU on a service

              _Alert: `ServiceCpuHigh`. Fires when pod CPU is above 85 percent for 10 minutes._

              1. Open the `Ledger / Service overview` dashboard and find the affected service.
              2. Check whether a deployment happened in the last 30 minutes. If yes, and the error rate is also elevated, roll back with `contoso-deploy rollback <service>`.
              3. Check traffic. If requests per second are above the usual peak of 180, the horizontal pod autoscaler should add pods. The default maximum is 10 pods for ledger-service and 8 for payments-service. The on-call engineer may raise the maximum temporarily to 16 with `kubectl patch hpa`.
              4. Look for slow queries in the database dashboard. A query running longer than 5 seconds should be reported in #on-call.
              5. If CPU stays high after 30 minutes of mitigation, open a SEV3 incident and notify the owning team.

              Do not restart pods one by one during high load; this increases the load on the remaining pods.

