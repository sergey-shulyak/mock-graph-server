              # Kestrel Retail dispute: summary

              Restricted. Legal Counsel only. Do not forward.

              ## Facts

              Kestrel Retail is an Enterprise customer with a monthly fee of EUR 24,800. After the payments outage of 22 July 2026 (1 hour 52 minutes), Kestrel claims EUR 85,000 for lost sales and SLA breach.

              ## Our position

              - The contractual service credit for the missed July availability commitment is 25 percent of the monthly fee: EUR 6,200.
