          - path: /General/Security
          - path: /General/Security/access-requests.md
            content: |
              # Requesting access to systems and data

              Access at Contoso follows the principle of least privilege.

              ## How to request

              1. Open the "Access request" form in the IT portal.
              2. Name the system or folder, the role you need and the reason.
              3. Your manager approves first. For Confidential or Restricted data the data owner approves second.
              4. IT grants access, normally within 2 business days.

              ## Temporary access

              Access to production systems is temporary and granted by the on-call lead. It expires automatically. Temporary access may never be extended for more than 30 days in total.

              ## Reviews and removal

              - Access is reviewed every quarter by team managers. Unused access is removed.
              - When someone changes teams, access from the old team is removed at the end of the move week.
              - Access of leavers is removed at 18:00 on their last working day.

              ## What not to do

              Do not ask a colleague to share their account, and do not share documents by copying them to a place with wider access. If you can see a document you should not be able to see, report it as a security incident.
          - path: /General/Security/data-classification.md
            content: |
              # Data classification

              Every document and dataset at Contoso has one of four classes.

              | Class | Meaning | Examples |
              |---|---|---|
              | Public | Approved for anyone | Website text, published docs |
              | Internal | For all employees | Policies, wiki pages, this document |
              | Confidential | Limited to people who need it | Customer data, contracts, financial reports |
              | Restricted | Highest sensitivity | Salary data, secrets and keys, investigation files, legal disputes |

              ## Handling rules

              - Label new documents. If you are unsure, use Internal.
              - Confidential and Restricted files may only be stored in the SharePoint sites that match their audience. Never attach them to emails sent outside the company.
              - Customer personal data (names, emails, bank details) is always Confidential, even in test exports.
              - Restricted data may not be copied to personal devices or sent over chat.
              - External sharing is allowed for Public documents and, with a signed NDA, for Internal ones.

              ## Review

              Data owners review the class of their documents once a year. The security team audits access to Restricted data every quarter.
          - path: /General/Security/incident-reporting.md
            content: |
              # Reporting a security incident

              A security incident is anything that may expose company or customer data: a lost laptop, a phishing email you clicked, a leaked password or key, a document shared with the wrong people.

              ## What to do

              1. Report it within 1 hour of noticing. Do not wait to be sure.
              2. Email security@contoso-mock.onmicrosoft.com and post in the Slack channel #sec-incidents. Outside business hours call the security hotline +380 32 000 0000.
              3. Do not delete anything and do not try to investigate on your own.
              4. Keep the device switched on if you can; the security team may ask you to disconnect it from the network.

              ## What happens next

              The security team assigns a severity from SEV1 (customer data exposed) to SEV4 (minor policy breach) and an incident owner. SEV1 and SEV2 incidents get a written postmortem within 5 business days. Reporting in good faith is never punished.

              ## Related

              - Credentials that may have leaked are rotated by the security team, not by the person who found them.
              - Production outages follow the engineering incident response process.
