          - path: /Policies/code-of-conduct.md
            content: |
              # Code of conduct

              Contoso expects everyone, employees, contractors and visitors, to behave respectfully.

              ## What we expect

              - Treat colleagues and customers with courtesy. Disagree with ideas, not people.
              - Do not harass, bully or discriminate. This includes comments, jokes, messages and images.
              - Keep confidential information confidential. Follow the data classification rules.
              - Declare conflicts of interest to your manager and HR, for example a family member working for a customer or supplier.
              - Gifts from suppliers above EUR 50 in value must be declined or reported to HR.

              ## Speaking up

              If you experience or see a violation, tell your manager, HR (Carol HR) or use the anonymous form on the HR site. Reports are taken seriously, handled confidentially and followed up within 10 working days. Retaliation against anyone who reports in good faith is itself a violation.

              ## Consequences

              Violations lead to measures that range from a conversation and a written warning to dismissal. Serious cases are handled under the confidential complaint procedure by HR.
          - path: /Policies/compensation-overview.md
            content: |
              # Compensation overview

              _Last reviewed: 12 September 2025. Owner: HR._

              ## How pay works

              - Salaries are paid monthly on the 25th, in the currency of the employment contract.
              - Every role belongs to a level, from L1 (junior) to L7 (principal / director). Each level has a salary band. The bands themselves are confidential and are shared only with HR and management.
              - Bands are reviewed every January. Increases that follow the annual performance review take effect on 1 February.

              ## Allowances

              - On-call allowance: EUR 120 per on-call week, paid with the next salary.
              - Referral bonus: EUR 1,000 for a successful referral, paid after the new colleague has passed probation. See the referral programme page.
              - Business expenses are reimbursed under the expense policy in the Finance site, not through salary.

              ## Questions about your own pay

              Ask your manager or HR. HR will not discuss the pay of other employees. If you think your level is wrong, raise it in your annual review or contact HR at any time.

              ## Equal pay

              HR checks pay by level and gender once a year and corrects unexplained gaps in the February salary run.
          - path: /Policies/employee-handbook-2026.docx
            source: company/employee-handbook-2026.docx
          - path: /Policies/offboarding-process.md
            content: |
              # Offboarding process

              ## Notice

              The notice period is 1 month for employees, unless the contract says otherwise. Employees are asked to give notice in writing to their manager and HR.

              ## Checklist for the manager

              1. Plan a handover of work and documents. Handover notes are due in the last week.
              2. Remove the leaver from team rotations, including on-call.
              3. Tell customers and partners who need to know.

              ## Checklist for HR

              1. Hold an exit interview in the last week.
              2. Confirm remaining vacation. Unused days are paid out in the final salary.
              3. Send the final payslip. The final payment is made within 5 business days after the last working day.

              ## Checklist for IT

              - All access is removed at 18:00 on the last working day.
              - The leaver returns the laptop and badge within 5 business days of the last working day.
              - Accounts are disabled; mailboxes are kept for 90 days and then deleted.

              ## After leaving

              The leaver keeps no access to Slack, email, Jira, GitHub or any shared site. Former employees who want to be rehired may apply again after 3 months.
          - path: /Policies/parental-leave-policy.md
            content: |
              # Parental leave policy

              _Version 1.4, effective 1 January 2026. Owner: HR._

              ## Entitlement

              - The primary caregiver receives 18 weeks of fully paid parental leave.
              - The secondary caregiver receives 4 weeks of fully paid parental leave, which can be taken in one block or split in two within the first 12 months.
              - The policy applies equally to birth, adoption and surrogacy, and to every employee regardless of gender, who has completed probation.

              ## How to apply

              1. Tell your manager and HR at least 8 weeks before the expected start date.
              2. HR sends a confirmation letter within 5 working days.
              3. Hand over your work at least 2 weeks before the leave starts.

              ## During leave

              - Your salary level, vacation accrual and seniority continue as normal.
              - Your laptop stays with you; your access is not removed.
              - Your manager may contact you only in agreed circumstances.

              ## Returning

              You return to the same or an equivalent role. Phased return at 60 percent of working time for the first 4 weeks is available on request, with full pay.

              Questions: hr@contoso-mock.onmicrosoft.com.
          - path: /Policies/performance-review-process.docx
            source: company/performance-review-process.docx
          - path: /Policies/Remote Work Policy.md
            content: |
              # Remote work policy

              _Version 2.2, effective 1 April 2026. Owner: HR (Carol HR)._

              ## Eligibility

              Remote work is available to all employees who have completed probation. Employees on probation may work remotely one day per week.

              ## How much

              - Employees may work remotely up to 3 days per week, agreed with their manager. At least 2 days per week are spent in the office.
              - Fully remote arrangements need written approval from the head of the department and HR.
              - Everyone must be reachable during core hours, 11:00 to 16:00 Kyiv time.

              ## Working from abroad

              You may work from Ukraine or Poland without a special request. Working from any other country is limited to 30 calendar days per year and must be approved by HR at least 14 days before you leave. Tax and legal rules differ per country, so HR may refuse a request.

              ## Security

              - Use the company laptop only. Personal computers must not hold company data.
              - Connect to the VPN for internal systems; do not use public Wi-Fi without it.
              - Do not leave a laptop unattended in public places.

              ## Managers

              Managers keep the team calendar up to date so that everybody knows who is in the office on which day. A manager may suspend a remote arrangement for performance or business reasons with 2 weeks of notice.
