          - path: /Restricted-OnCall/secrets-rotation-procedure.md
            content: |
              # Secrets rotation procedure

              Restricted. Readable by the engineering site owners (Engineering management and DevOps).

              ## Schedule

              - Application secrets stored in Vault are rotated every 90 days.
              - Database credentials are issued as dynamic Vault leases with a 1 hour lifetime and are not rotated manually.
              - API keys of payment providers are rotated every 180 days by the DevOps lead together with Finance.

              ## Emergency rotation

              1. The security team confirms the exposure and declares a SEV1 or SEV2 incident.
              2. The on-call lead revokes the affected Vault paths with `vault lease revoke -prefix`.
              3. New secrets are generated and the deployments are restarted through ArgoCD.
              4. The provider is asked to invalidate the old key.

              ## Break-glass account

              The break-glass account for the Vault root is split into two sealed envelopes kept in the safe on floor 6 of the Lviv office. Opening the safe needs two people from the owner group. Any use of the account is reported to the security team within 1 hour.
