          - path: /Architecture/platform-architecture-overview.md
            content: |
              # Contoso platform architecture overview

              _Edition of 18 August 2026. Owners: Alice Backend and Henry DevOps. Audience: engineers and technical contractors._

              ## 1. Purpose

              This document describes how Contoso Ledger and Contoso Pulse are built, how data flows between components, and which constraints shape the design. It is meant to be the first thing a new engineer reads after the local setup guide. Decisions are recorded in ADRs; this overview links the pieces.

              ## 2. Context

              Contoso Ledger is a multi-tenant SaaS accounting and payments platform. About 412 customer organisations use it. Customers use the web portal, a public REST API (version v2) and connectors to banks and payment providers. Contoso Pulse reads ledger data and produces dashboards.

              The main non-functional requirements are:

              - **Correctness**: every journal entry must balance. Money is never lost or created.
              - **Availability**: 99.9 percent per month for the Ledger API (99.95 percent for Enterprise customers by contract).
              - **Latency**: 95th percentile under 300 ms for API reads and writes.
              - **Auditability**: every change to financial data is recorded with who, when and why.
              - **Tenant isolation**: a customer can never read another customer's data.

              ## 3. Logical architecture

              Traffic enters through the **api-gateway**, which terminates TLS, authenticates tokens, applies rate limits and routes requests. Behind it run these services:

              | Service | Responsibility |
              |---|---|
              | identity-service | Users, organisations, roles, single sign-on and API keys |
              | ledger-service | Chart of accounts, journal entries, balances; the system of record |
              | payments-service | Payment initiation, reconciliation and provider webhooks |
              | bank-feed-service | Imports bank transactions from providers and matches them to invoices |
              | invoicing-service | Invoices, credit notes and PDF rendering (created in project Atlas) |
              | reporting-service | Reports and the Pulse data pipeline |
              | notification-service | Email and in-app notifications |

              Services call each other synchronously only where an answer is needed immediately; everything else uses events.

              ## 4. Data

              PostgreSQL 16 is the system of record (ADR-0007). Each service owns its schema and never reads another service's tables. The ledger-service database runs as a Patroni cluster with one primary and two replicas. Replicas serve read traffic for reporting. Automatic failover completes in under 60 seconds in normal conditions.

              Redis 7 caches session data and rate limit counters; it is never the source of truth.

              Object storage holds invoice PDFs and exports. Files are encrypted at rest and addressed by random identifiers.

              Tenant isolation is enforced by an `organisation_id` column on every table and by row-level security policies in PostgreSQL. Integration tests verify that queries without a tenant context return nothing.

              ## 5. Events

              Apache Kafka 3.7 is the event backbone. Services publish domain events after they commit a transaction, using the transactional outbox pattern, so that events are never lost and never published for rolled-back changes.

              Examples of topics: `ledger.entry.posted`, `payments.payment.settled`, `bankfeed.transaction.imported`. Events are serialised as Avro and validated against the schema registry. Consumers must be idempotent; every event has a unique identifier and consumers store the last processed offset per partition.

              Retention is 7 days for operational topics and 30 days for audit topics. Long-term audit data is exported to object storage.

              ## 6. Public API

              The API follows the internal REST style guide. The major version is in the path (ADR-0019): v2 is current and v1 is supported until 31 December 2026. All state-changing requests that move money require an `Idempotency-Key` header. The gateway limits each API key to 600 requests per minute; Enterprise customers can request higher limits.

              Webhooks notify customers of payment and invoice events. Delivery is retried with exponential backoff for up to 24 hours. Webhook payloads are signed with an HMAC.

              ## 7. Security architecture

              - Authentication uses OpenID Connect with Okta for employees and the identity-service for customers.
              - Service-to-service traffic uses mutual TLS provided by the service mesh.
              - Secrets live in HashiCorp Vault; services receive short-lived credentials.
              - Personal data fields are encrypted at the application level with keys managed in a hardware-backed key store.
              - Network access to production is through a bastion with MFA. Engineers receive temporary access through the on-call lead.
              - Every release is scanned for vulnerabilities and signed.

              ## 8. Deployment

              All services run on Kubernetes 1.30 in Azure. Environments are described with Terraform. Applications are deployed by ArgoCD from the `contoso-deploy` repository. Releases use a canary strategy: 10 percent of traffic for 30 minutes, then 100 percent, with automatic rollback if the error rate exceeds 2 percent for 5 minutes.

              Production runs in two availability zones within one Azure region. Each service has at least three replicas. Horizontal pod autoscalers scale the busiest services (ledger-service up to 10 pods by default, payments-service up to 8).

              ## 9. Observability

              Prometheus collects metrics, Grafana shows dashboards, Loki stores logs and PagerDuty routes alerts. Every service has these standard alerts:

              - Error rate above 2 percent for 5 minutes
              - 95th percentile latency above 300 ms for 10 minutes
              - CPU above 85 percent for 10 minutes
              - Kafka consumer lag above 10,000 messages for 5 minutes
              - Disk usage above 70 percent on database volumes
              - TLS certificates expiring in less than 30 days

              Each alert links to a runbook in the engineering runbooks library.

              ## 10. Key flows

              ### 10.1 Posting a journal entry

              1. The client calls `POST /v2/journal-entries` through the gateway.
              2. The gateway authenticates the token and forwards the request with the tenant context.
              3. The ledger-service validates that debits equal credits, writes the entry and an outbox record in one transaction.
              4. The outbox relay publishes `ledger.entry.posted`.
              5. The reporting-service updates its aggregates; the notification-service may send an email.

              ### 10.2 Receiving a bank feed

              1. The bank-feed-service polls providers every 15 minutes, or receives a webhook where the provider supports it.
              2. New transactions are stored and published as `bankfeed.transaction.imported`.
              3. The matching job proposes matches against open invoices. Matches with confidence above 0.9 are applied automatically.
              4. Unmatched transactions appear in the portal for the customer to review.

              ### 10.3 Paying an invoice

              1. The customer starts a payment in the portal.
              2. The payments-service creates a payment intent with the provider and returns a redirect.
              3. The provider calls the webhook endpoint when the payment settles. The endpoint is protected with mutual TLS and a signature check.
              4. The payments-service posts the settlement to the ledger-service and publishes `payments.payment.settled`.

              ## 11. Capacity and scaling

              At the moment the platform handles about 180 requests per second at peak, with a target of 500. The largest tenant has about 2.1 million journal entries. Reporting queries are the heaviest workload and are isolated on replicas. The main scaling plan is to partition the ledger tables by organisation when a single primary reaches 60 percent sustained CPU, as described in ADR-0007.

              ## 12. Known limitations

              - A single Azure region: a regional outage would take the platform offline. A multi-region design is on the roadmap but not scheduled.
              - The invoicing PDF renderer is single-threaded and slows down for very long company names.
              - The CSV export holds results in memory and times out for accounts with more than 50,000 entries.
              - Bank feed delays depend on provider behaviour and are not under our control.

              ## 13. Roadmap

              1. Project Phoenix: a new customer portal with a public beta on 16 November 2026 and general availability planned for 1 February 2027. It talks only to the public v2 API.
              2. Streaming export to replace the CSV export.
              3. Retirement of API v1 on 31 December 2026.
              4. A second invoicing renderer built on a headless browser pool.

              ## 14. Cost and efficiency

              Cloud spend in the third quarter of 2026 was EUR 412,000 per quarter, of which compute is 54 percent, managed storage 21 percent, networking 11 percent and observability 9 percent. The platform team reviews the largest line items every month. Non-production environments are scaled to zero outside working hours, which saves about 22 percent of compute cost. Kafka retention and log retention are the two biggest levers still to be tuned.

              ## 15. Tenant data and data location

              All customer data is stored in the Azure region in the European Union. Backups are encrypted and kept for 35 days in the same region. Customers cannot choose another region today. Support engineers can only see customer data after a customer grants temporary support access in the portal, which lasts 24 hours and is logged. Exports requested by customers are available for 7 days and then deleted.

              ## 16. Environments and promotion

              Code moves through environments in a fixed order: every merge to `main` deploys to dev, the nightly pipeline promotes the latest green build to staging, and the release train promotes a signed build to production. Configuration differences between environments are kept in Helm values files reviewed in pull requests. Feature flags are managed in the flag service and have an owner and an expiry date; flags older than 90 days are reviewed for removal.

              ## 17. Glossary

              - **ADR**: architecture decision record.
              - **Canary**: deployment to a small share of traffic before a full rollout.
              - **IC**: incident commander.
              - **Outbox**: a table written in the same transaction as business data and relayed to Kafka.
              - **Tenant**: a customer organisation in Contoso Ledger.
              - **Train**: the scheduled release on Tuesday or Thursday at 14:00 Kyiv time.

              ## 18. How to contribute

              Propose changes through ADRs. Use the template in the Architecture/ADR folder, discuss it in #architecture and bring it to the architecture group, which meets every second Wednesday at 15:00 Kyiv time. Accepted ADRs are linked from this overview in the next edition.
