            content: |
              # Discount approval

              _Owner: Sales (Jack Sales) with Finance (Irene Finance). Version 2026-05._

              | Discount on subscription fees | Who can approve |
              |---|---|
              | Up to 5 percent | The sales representative |
              | Over 5 and up to 10 percent | The sales lead (Jack Sales) |
              | Over 10 and up to 25 percent | The Finance Director (Irene Finance) and the CEO together |
              | Over 25 percent | Not allowed |

              ## Rules

              - Discounts apply to subscription fees only. They do not apply to the implementation fee or to add-ons.
              - A three-year commitment can earn an additional 5 percentage points, within the limits above.
              - Every discount is recorded in the CRM before a quote is sent.
              - Approvals are answered within 1 business day. Escalated approvals are decided in the weekly pricing call on Wednesday at 11:00.

              ## What to do if a customer asks for more

              Offer a longer term or a larger user count instead of a lower price. If the customer insists on a discount above 25 percent, escalate to the sales lead, who may involve the management committee for a strategic account.
